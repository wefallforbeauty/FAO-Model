[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fao-model"
version = "0.3.0"
description = "Reference ET equations, a crop water balance on a 3D Richards soil-water solver, and a forecasting dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
gui = ["matplotlib"]
forecast = ["timesfm"]
validation = ["pandas", "pyfao56"]
dev = ["pytest", "matplotlib", "pandas", "pyfao56"]

[tool.setuptools.packages.find]
include = ["fao_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
