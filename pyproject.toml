[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fao-model"
version = "0.2.0"
description = "Reference ET equations, a 3D Richards soil-water solver and a forecasting dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
gui = ["matplotlib"]
forecast = ["timesfm"]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
include = ["fao_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
